[package]
name = "openroutervoice"
version = "0.1.0"
description = "Ultra-low-latency speech-to-text via the OpenRouter API"
authors = ["OpenRouter Voice example"]
edition = "2021"

[lib]
name = "openroutervoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"

# Audio pipeline
cpal = "0.15"
rubato = "0.15"
hound = "3.5"
voice_activity_detector = "0.2"
crossbeam-channel = "0.5"

dirs = "5"
tauri-plugin-autostart = "2.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

# Global hotkey (keyboard + mouse), key synthesis, and OAuth login
device_query = "2"
enigo = "0.2"
sha2 = "0.10"
rand = "0.8"
open = "5"

[profile.release]
lto = true
codegen-units = 1
